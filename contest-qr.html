<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dead Culture — Entry QR Code</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#9760;</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --void: #0B0B0C; --ink: #E7E4DD; --ink-soft: #8C8880; --rule: #29282A; --blood: #8A1216; --blood-dim: #631014;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  :root[data-theme="light"] {
    --void: #F1EFEA; --ink: #17151A; --ink-soft: #5C5852; --rule: #D7D2C8; --blood: #7A1014; --blood-dim: #9C2C30;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--void); color: var(--ink);
    font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { max-width: 380px; width: 100%; margin: 0 auto; padding: 48px 24px; text-align: center; }
  .kicker { font-size: 11px; letter-spacing: 0.22em; color: var(--blood); margin: 0 0 14px; text-transform: uppercase; }
  h1 {
    font-family: 'Cinzel', serif; font-size: clamp(26px, 8vw, 34px); font-weight: 600;
    margin: 0 0 8px; letter-spacing: 0.02em; text-transform: uppercase;
  }
  .tagline { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 36px; }
  .qr-frame {
    display: inline-block; background: #FFFFFF; padding: 20px;
    border: 1px solid var(--rule);
  }
  #qrcode { line-height: 0; }
  .url {
    margin-top: 22px; font-size: 12px; color: var(--ink-soft);
    word-break: break-all; letter-spacing: 0.01em;
  }
  .btn {
    display: inline-block; margin-top: 26px; background: var(--blood); color: #F1EFEA;
    font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none; padding: 14px 26px; border: none; cursor: pointer;
  }
  .btn:hover { background: var(--blood-dim); }
  footer { margin-top: 40px; font-size: 12px; color: var(--ink-soft); }
  .setup-note {
    font-size: 12px; color: var(--ink-soft); background: color-mix(in srgb, var(--blood) 8%, transparent);
    border: 1px dashed var(--rule); padding: 14px 16px; margin-top: 36px; text-align: left;
  }
  .setup-note code { color: var(--blood); }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Scan to Enter</p>
  <h1>Dead Culture</h1>
  <p class="tagline">Poetry & Short Story Contest</p>

  <div class="qr-frame"><div id="qrcode"></div></div>
  <div class="url" id="urlDisplay"></div>

  <div>
    <a class="btn" id="downloadBtn" href="#">Download PNG</a>
  </div>

  <div class="setup-note">
    <strong>Setup:</strong> edit <code>CONFIG.targetUrl</code> below in the page code if your entry page link ever changes, then republish.
  </div>

  <footer>@Dead_Culture_Press</footer>
</div>

<script>
  const CONFIG = {
    targetUrl: "https://claude.ai/artifact/Kfa1QdsyMSfkvJwx25Qrcx"
  };

  document.getElementById('urlDisplay').textContent = CONFIG.targetUrl;

  new QRCode(document.getElementById("qrcode"), {
    text: CONFIG.targetUrl,
    width: 240,
    height: 240,
    colorDark: "#0B0B0C",
    colorLight: "#FFFFFF",
    correctLevel: QRCode.CorrectLevel.H
  });

  // Wait a tick for the QR canvas/img to render, then wire up download
  setTimeout(function () {
    const container = document.getElementById('qrcode');
    const canvas = container.querySelector('canvas');
    const btn = document.getElementById('downloadBtn');
    if (canvas) {
      btn.href = canvas.toDataURL("image/png");
      btn.setAttribute('download', 'dead-culture-entry-qr.png');
    } else {
      btn.style.display = 'none';
    }
  }, 200);
</script>
</body>
</html>
